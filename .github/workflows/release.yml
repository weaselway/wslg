name: Release system image

on:
  push:
    tags: ['v*']

# Needed to create the release and upload the asset to it.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # devops/get-nuget-version.sh derives WSLG_VERSION with `git
          # describe`, so the tags have to be present.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # build-and-export.sh converts the tar to a VHD with `go run`ning
          # hcsshim's tar2ext4.
          go-version: stable

      - uses: ./.github/actions/build-system-image

      - name: Compress the VHD
        run: |
          gzip -9 system_x64.vhd
          mv system_x64.vhd.gz "system_x64-${GITHUB_REF_NAME}.vhd.gz"

      - name: Create the release and attach the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases and their assets are immutable: if a release already
          # exists for this tag, `gh release create` fails and the workflow
          # fails with it rather than replacing a published artifact.
          gh release create "${GITHUB_REF_NAME}" \
              "system_x64-${GITHUB_REF_NAME}.vhd.gz" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
